name: Update Badges

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update-badges:
    name: Update README with Credly Badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update Badges
        uses: pemtajo/badge-readme@main
        with:
          CREDLY_USER: "hassansardarnaveed"
          NUMBER_LAST_BADGES: 0
          BADGE_SIZE: "110"
          NUMBER_REPOS_PER_ROW: "6"
